<body>
    <h1>Head in the Clouds</h1>
    
    <div>
        <h2>Connexion</h2>
        
            <form id="form-signin">
                <label for="username-signup">Pseudo :</label>
                <input type="text" id="username-signup" name="username" required>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" required>
                <label>
                    <input type="checkbox" name="remember"> Se souvenir de moi 
                </label> 
                <input type="submit" value="Se connecter">
            </form>
            <input type="submit" value="Mot de passe oublié">        
    </div>
    
    <div>
        <h2>Inscription</h2>
        <form id="form-signup">
            <label for="email-signup">Email :</label>
            <input type="email" id="email-signup" name="email" required>
            <label for="password-signup">Choisir un mot de passe :</label>
            <input type="password" id="password-signup" name="password" required>
            <input type="submit" value="S'inscrire">
        </form>
        
    </div>
