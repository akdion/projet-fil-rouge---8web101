
<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie</title>
    <link rel="stylesheet" href="ressources/styles/conversations.css">
</head>

<body>
    <header>
        <h1>Ma messagerie</h1>
    </header>
    
    <main>
        <section class = "menu">
            
            <h3>Salons de discussion</h3>

                <div id="liste-salons">
                <div class="salon">Chat général</div>
                </div>

                <button id="creer-salon" type="button"> + Créer un salon </button>
                <div id="formulaire-salon" hidden>
                <input type="text" id="nom-salon" placeholder="Nom du nouveau salon" maxlength="50">

                <button type="button" id="confirmer-salon">
                    Créer
                </button>
                </div>
            
            <h3>Paramètres</h3>
            <a href = "parametres.html">Mes paramètres</a>
         </section>

         <section class= "conversation">
            <h2 id="titre-salon">Chat général</h2>

            <div class="messages" id="messages">
                <p>Bienvenue dans le chat !</p>
            </div>

            <form class="message-box" id="message-form">
                <input type="text", id="message-input", placeholder="Écrire un message", maxlenght="500", required>
                <button type="submit">Envoyer</button>
            </form>
         </section>

         <aside>
            <h3>Utilisateurs connectés</h3>
            <div id="utilisateurs"></div>
         </aside>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="ressources/scripts/spclient.js"></script>
     <script src="ressources/scripts/auth.js"></script> 
    <script src="ressources/scripts/conversations.js"> </script>  
</body>
</html>
